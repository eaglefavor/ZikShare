name: fetch-noun-gst

# One-off utility: download the NOUN General Studies e-courseware PDFs so they
# can be reviewed and hosted. Triggered only by a change to this file or to the
# trigger marker below — it is not part of the app's build or deploy pipeline,
# and it is removed once the files are in place.
on:
  push:
    paths:
      - '.github/workflows/fetch-noun-gst.yml'
      - 'scripts/fetch-noun-gst.trigger'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the e-courseware index and every GST PDF
        run: |
          set -u
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -fsSL -A "$UA" --max-time 120 'https://nou.edu.ng/ecourseware-degs/' -o index.html
          echo "index bytes: $(wc -c < index.html)"
          grep -oE 'https://nou\.edu\.ng/coursewarecontent/[^"]+\.pdf' index.html | sort -u > urls.txt
          echo "found $(wc -l < urls.txt) pdf urls"
          : > manifest.txt
          n=0
          while read -r u; do
            n=$((n + 1))
            f="out/$(printf '%03d' "$n").pdf"
            if curl -fsSL -A "$UA" --max-time 180 "$u" -o "$f"; then
              if head -c 5 "$f" | grep -q '%PDF-'; then
                echo "$(printf '%03d' "$n")|$u|$(stat -c %s "$f")" >> manifest.txt
              else
                echo "not a pdf: $u"
                rm -f "$f"
              fi
            else
              echo "failed: $u"
              rm -f "$f"
            fi
          done < urls.txt
          echo '--- manifest'
          cat manifest.txt
          ls -la out
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noun-gst
          path: |
            out
            manifest.txt
            urls.txt
            index.html
          if-no-files-found: warn
