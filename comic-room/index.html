<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INK BOY — a comic-print three.js loop</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14092b;
  }
  canvas { display: block; }

  /* ---------- comic graphic overlay layer (DOM) ---------- */
  #overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    font-family: Impact, "Arial Black", "Franklin Gothic Bold", sans-serif;
  }

  /* caption box — classic comic caption, yellow print + ben-day dots */
  #caption {
    position: absolute; top: 22px; left: 22px;
    max-width: 340px;
    background:
      radial-gradient(circle at 3px 3px, rgba(0,0,0,.28) 1.1px, rgba(0,0,0,0) 1.6px) 0 0/7px 7px,
      #ffd23f;
    color: #14141a;
    border: 3px solid #14141a;
    box-shadow: 7px 7px 0 rgba(10,4,24,.85);
    padding: 10px 14px 11px;
    transform: rotate(-1.6deg);
    font-size: 15px; letter-spacing: .6px; line-height: 1.35;
    text-transform: uppercase;
  }
  #caption b { display: block; font-size: 17px; }

  /* big dimensional comic lettering */
  #title {
    position: absolute; top: 18px; right: 26px; text-align: right;
    transform: rotate(1.4deg);
    color: #fff;
    -webkit-text-stroke: 3px #14141a;
    text-shadow:
      4px 4px 0 #e6399a,
      8px 8px 0 #14141a,
      12px 12px 0 rgba(10,4,24,.55);
    font-size: clamp(38px, 7vw, 84px);
    letter-spacing: 2px; line-height: .92;
  }
  #title small {
    display: block;
    -webkit-text-stroke: 0;
    text-shadow: 3px 3px 0 #14141a;
    color: #22c7d6;
    font-size: clamp(11px, 1.5vw, 17px);
    letter-spacing: 4px; margin-top: 10px;
  }

  #hint {
    position: absolute; bottom: 18px; right: 24px;
    color: #ffe9a8; font-size: 13px; letter-spacing: 2px;
    text-shadow: 2px 2px 0 #14141a, 4px 4px 0 rgba(10,4,24,.7);
    transform: rotate(-1deg);
    text-transform: uppercase;
  }

  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #14092b; color: #ffd23f; z-index: 20;
    font-family: Impact, "Arial Black", sans-serif; font-size: 26px; letter-spacing: 6px;
    text-shadow: 3px 3px 0 #e6399a;
  }
</style>
</head>
<body>
<div id="overlay">
  <div id="caption"><b>Meanwhile — in the bedroom studio…</b>
    one kid, one pencil, one very loud print job.</div>
  <div id="title">INK&nbsp;BOY<small>A COMIC-PRINT THREE.JS LOOP</small></div>
  <div id="hint">click / tap = punch-in + sfx burst</div>
</div>
<div id="boot">LOADING INK…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
