name: Fetch Roman drama texts

# Temporary: pulls public-domain English texts for the Roman theatre shelf into
# the repository, because the build sandbox cannot reach Project Gutenberg or
# the Internet Archive directly. Delete once the texts are committed.
on:
  push:
    paths:
      - scripts/fetch-roman.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download texts
        run: |
          set -eux
          mkdir -p library/drama/source-roman
          cd library/drama/source-roman

          # Seneca, The Tragedies, trans. Frank Justus Miller (Gutenberg 57999)
          curl -fsSL --retry 3 -A "ZikShare library build" \
            https://www.gutenberg.org/cache/epub/57999/pg57999.txt -o 57999.txt || \
          curl -fsSL --retry 3 -A "ZikShare library build" \
            https://www.gutenberg.org/files/57999/57999-0.txt -o 57999.txt || \
          curl -fsSL --retry 3 -A "ZikShare library build" \
            https://www.gutenberg.org/ebooks/57999.txt.utf-8 -o 57999.txt

          # Terence, The Comedies, trans. Henry Thomas Riley (Gutenberg 22188)
          curl -fsSL --retry 3 -A "ZikShare library build" \
            https://www.gutenberg.org/cache/epub/22188/pg22188.txt -o 22188.txt || \
          curl -fsSL --retry 3 -A "ZikShare library build" \
            https://www.gutenberg.org/files/22188/22188-0.txt -o 22188.txt || \
          curl -fsSL --retry 3 -A "ZikShare library build" \
            https://www.gutenberg.org/ebooks/22188.txt.utf-8 -o 22188.txt

          # Plautus, The Comedies, trans. Henry Thomas Riley (Bohn, 1880/1895).
          # Project Gutenberg carries only Captivi and Mostellaria, so the two
          # volumes come from the Internet Archive's OCR of the printed books.
          for id in comediesofplautu01plauuoft comediesliterall02plauuoft; do
            curl -fsSL --retry 3 -A "ZikShare library build" \
              "https://archive.org/download/$id/${id}_djvu.txt" -o "$id.txt" || true
          done

          ls -l
          for f in *.txt; do printf '%s lines=%s bytes=%s\n' "$f" "$(wc -l < "$f")" "$(wc -c < "$f")"; done

      - name: Commit
        run: |
          git config user.name "ZikShare library bot"
          git config user.email "library@zikshare.local"
          git add library/drama/source-roman
          git commit -m "Add the Roman drama source texts" || echo "nothing to commit"
          git push
