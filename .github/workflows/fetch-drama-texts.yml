name: fetch-drama-texts

# One-off utility: download the public-domain Project Gutenberg texts for the
# Greek tragedy shelf so they can be typeset into PDFs and hosted by ZikShare.
# Triggered only by a change to this file or the trigger marker; removed once
# the texts are in place.
on:
  push:
    paths:
      - '.github/workflows/fetch-drama-texts.yml'
      - 'scripts/fetch-drama.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download every text
        run: |
          set -u
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          mkdir -p library/drama/source
          # The ebook ids come from src/lib/dramaLibrary.js.
          ids=$(grep -oE 'gutenbergId: [0-9]+' src/lib/dramaLibrary.js | grep -oE '[0-9]+' | sort -u)
          echo "ids: $ids"
          for id in $ids; do
            out="library/drama/source/$id.txt"
            if [ -s "$out" ]; then echo "have $id"; continue; fi
            ok=0
            for url in "https://www.gutenberg.org/cache/epub/$id/pg$id.txt" \
                       "https://www.gutenberg.org/files/$id/$id-0.txt" \
                       "https://www.gutenberg.org/ebooks/$id.txt.utf-8"; do
              if curl -fsSL -A "$UA" --max-time 180 "$url" -o "$out"; then
                if grep -q 'PROJECT GUTENBERG' "$out"; then ok=1; break; fi
              fi
            done
            if [ "$ok" = "1" ]; then
              echo "ok $id $(wc -c < "$out") bytes"
            else
              echo "FAILED $id"; rm -f "$out"
            fi
          done
          ls -la library/drama/source

      - name: Commit the texts
        run: |
          git config user.name "zikshare-library-bot"
          git config user.email "bot@zikshare.local"
          git add library/drama/source
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Download the Project Gutenberg texts for the Greek tragedy shelf"
          git push origin HEAD:${{ github.ref_name }}
