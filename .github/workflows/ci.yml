name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Edge Function TypeScript
        run: |
          deno check supabase/functions/initialize-paystack-payment/index.ts
          deno check supabase/functions/verify-paystack-payment/index.ts
          deno check supabase/functions/paystack-webhook/index.ts
          deno check supabase/functions/create-paystack-subaccount/index.ts
          deno check supabase/functions/resolve-bank-account/index.ts
          deno check supabase/functions/initiate-seller-payout/index.ts
